<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILITECH // LOG_ANALYTICS</title>
    <style>
        body { background: #070605; color: #ff5500; font-family: 'Courier New', monospace; padding: 20px; margin: 0; }
        .wrapper { max-width: 1200px; margin: 0 auto; }
        h1 { text-shadow: 0 0 10px #ff5500; border-bottom: 2px solid #ff5500; padding-bottom: 15px; font-size: 22px; }
        .auth-box { background: #110e0a; border: 1px solid #ff5500; padding: 30px; text-align: center; max-width: 400px; margin: 100px auto; }
        input, button { background: #000; border: 1px solid #ff5500; color: #fff; padding: 12px; font-family: inherit; outline: none; }
        button { color: #ff5500; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        button:hover { background: #ff5500; color: #000; box-shadow: 0 0 10px #ff5500; }
        
        .counter-blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .card { background: #110e0a; border-left: 4px solid #ff5500; padding: 15px; }
        .card-num { font-size: 24px; font-weight: bold; color: #fff; }
        
        table { width: 100%; border-collapse: collapse; background: #110e0a; margin-top: 10px; font-size: 13px; }
        th, td { border: 1px solid rgba(255, 85, 0, 0.2); padding: 12px; text-align: left; }
        th { background: rgba(255, 85, 0, 0.1); color: #fff; }
        tr:hover { background: rgba(255, 85, 0, 0.05); }
        .badge { background: rgba(255, 85, 0, 0.2); padding: 3px 6px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="auth-box" id="lock-screen">
            <h3>// ACCESS_RESTRICTED //</h3>
            <input type="password" id="pass-key" placeholder="КЛЮЧ АДМИНИСТРАТОРА" style="width: 80%; text-align: center;"><br><br>
            <button onclick="fetchLoggerData()">ИНИЦИАЛИЗИРОВАТЬ ПОДКЛЮЧЕНИЕ</button>
        </div>

        <div id="dashboard" style="display: none;">
            <h1>// ПАНЕЛЬ МОНИТОРИНГА ТРАФИКА: АКТИВНА</h1>
            
            <div class="counter-blocks">
                <div class="card"><div>ВСЕГО ХЭШЕЙ (КЛИКОВ)</div><div class="card-num" id="total-clicks">0</div></div>
                <div class="card"><div>УНИКАЛЬНЫХ IP</div><div class="card-num" id="uniq-ips">0</div></div>
                <div class="card"><div>ПОСЛЕДНЯЯ АКТИВНОСТЬ</div><div class="card-num" id="last-time" style="font-size:16px; margin-top:8px;">Нет данных</div></div>
            </div>

            <h3>[СИСТЕМНЫЙ ЛОГ ПЕРЕХВАТА]</h3>
            <table>
                <thead>
                    <tr>
                        <th>Время (МСК)</th>
                        <th>IP-Адрес</th>
                        <th>Тип / ОС</th>
                        <th>Тип ловушки</th>
                        <th>Геопозиция / Провайдер</th>
                    </tr>
                </thead>
                <tbody id="table-data"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchLoggerData() {
            const password = document.getElementById('pass-key').value;
            const res = await fetch('/api/get-logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                
                const tableBody = document.getElementById('table-data');
                tableBody.innerHTML = '';
                
                // Считаем метрики [4]
                document.getElementById('total-clicks').innerText = data.logs.length;
                const uniqueIps = new Set(data.logs.map(l => l.ip)).size;
                document.getElementById('uniq-ips').innerText = uniqueIps;
                if(data.logs.length > 0) {
                    document.getElementById('last-time').innerText = data.logs[data.logs.length - 1].time;
                }

                // Рендерим логи наоборот (свежие сверху) [4]
                data.logs.reverse().forEach(log => {
                    tableBody.innerHTML += `
                        <tr>
                            <td>${log.time}</td>
                            <td style="color:#fff; font-weight:bold;">${log.ip}</td>
                            <td>${log.device} (${log.os})</td>
                            <td><span class="badge">${log.method}</span> <span style="font-size:11px; color:#aaa;">${log.extra || ''}</span></td>
                            <td>📍 ${log.country}, ${log.city}<br><span style="font-size:11px; color:rgba(255,85,0,0.6);">${log.isp}</span></td>
                        </tr>`;
                });
            } else {
                alert(data.message);
            }
        }
    </script>
</body>
</html>
